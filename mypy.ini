[mypy]
python_version = 3.11
files = src/agents/market_agent/types.py, src/agents/market_agent/pipeline.py, src/agents/market_agent/normalizer.py, src/agents/market_agent/__main__.py, tests/integration/test_market_agent_smoke.py
warn_unused_configs = True
show_error_codes = True
pretty = True
check_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True

[mypy-src.agents.base.*]
follow_imports = skip

[mypy-src.agents.market_agent.analyzer]
follow_imports = skip